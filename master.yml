---
- name: Set up debian box
  hosts: all
  pre_tasks:
    - name: Set ansible_become_exe for sudo-rs (Ubuntu) boxes
      ansible.builtin.set_fact:
        ansible_become_exe: /usr/bin/sudo.ws
      when:
        - ansible_facts['distribution'] == 'Ubuntu'
        - ansible_facts['distribution_version'] is version('25.10', '>=')
      tags: always
  roles:
    - system
    - role: disks
    # A little redundant, but I typo this enough to have both
      when:
        - "'vm' not in group_names"
        - "'vms' not in group_names"
        - "'pi' not in group_names"
        - "'pis' not in group_names"
    - editor
    - mounts
    - backups
    - containers
    - terminal
    - role: artis3n.tailscale.machine
      when: "'tailscale' in group_names"
      tags: tailscale
    - notifications
    - file_manager
    #   - reverse_proxy
    - drift_management
    - mrlesmithjr.netplan
    - role: virtualization
      tags: libvirt,libvirtd
  tasks:
    # The default didn't fill the disk, this fixes it
    - name: Extend logical volumes to fill volume group
      become: true
      community.general.lvol:
        vg: ubuntu-vg
        lv: ubuntu-lv
        size: 100%VG
        shrink: false
        resizefs: true
    # This machine is pretty quiet, but just to prevent any fan spikes
    - name: Disable turbo and prefer low power
      become: true
      ansible.builtin.copy:
        content: |
          w /sys/devices/system/cpu/intel_pstate/no_turbo - - - - 1
          w /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference - - - - power
        dest: /etc/tmpfiles.d/quiet-cpu.conf
        group: root
        mode: "0644"
        owner: root
      notify: Apply tmpfiles
  handlers:
    - name: Apply tmpfiles
      become: true
      ansible.builtin.command:
        cmd: systemd-tmpfiles --create /etc/tmpfiles.d/quiet-cpu.conf
      changed_when: true
